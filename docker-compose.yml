networks:
    survey-network:
        driver: bridge

services:
    web:
        container_name: survey_nginx
        build:
            context: ./
            dockerfile: web.dockerfile
        volumes:
            - ./:/var/www
        ports:
            - '1295:80'
        networks:
            - survey-network
        links:
            - app

    app:
        container_name: survey_app
        build:
            args:
                user: sammy
                uid: 1000
            context: ./
            dockerfile: app.dockerfile
        restart: unless-stopped
        ports:
            - '1225:1225'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        env_file: '.env'
        networks:
            - survey-network
        links:
            - db

    db:
        image: mariadb:10.4
        container_name: survey_db
        #platform: linux/amd64 #for platform error on Apple M1 chips
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - ./database:/docker-entrypoint-initdb.d
        ports:
            - '2124:3306'
        networks:
            - survey-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:5.2.1
        container_name: survey_phpmyadmin
        restart: always
        environment:
            PMA_HOST: db
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
            UPLOAD_LIMIT: 300M
        ports:
            - '1331:80'
        networks:
            - survey-network